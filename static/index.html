<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El 1% · Jugador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/theme-1porciento.css">
</head>
<body class="theme-1p">
  <div id="overlay" class="overlay">
    <div class="overlay-content" id="overlayContent">
      <span class="icon" id="overlayIcon">✔</span>
      <h2 id="overlayTitle">Respuesta enviada</h2>
      <p id="overlaySub" class="hint" style="color:#cbd5e1;">Espera al final del tiempo</p>
    </div>
  </div>

  <header>
    <div class="flex">
      <h1>El 1% · Jugador</h1>
      <span class="pill" id="playerBadge">Sin unir</span>
    </div>
    <div class="flex">
      <span class="pill" id="codeBadge">Código: —</span>
      <span class="pill" id="scoreBadge">Puntos: 0</span>
      <button class="btn secondary" id="resetBtn" style="display:none;">Salir</button>
    </div>
  </header>

  <main class="layout">
    <section id="joinSection" class="card">
      <div class="section-title">
        <h2>Unirse a la partida</h2>
      </div>
      <form id="joinForm" class="grid two">
        <input id="codeInput" class="input" placeholder="Código (ej: F7K2)" maxlength="8" required>
        <input id="nameInput" class="input" placeholder="Tu nombre" minlength="2" required>
        <button type="submit" class="btn">Unirme</button>
      </form>
      <div id="rosterSection" style="display:none;">
        <p class="hint">Elige tu nombre de la lista:</p>
        <input id="rosterSearchInput" class="input" placeholder="Busca tu nombre...">
        <div id="rosterList" style="max-height:260px; overflow-y:auto; display:grid; gap:8px; margin-top:10px;"></div>
      </div>
      <p class="hint" id="joinHint"></p>
    </section>

    <section id="gameSection" style="display:none;">
      <div class="question-stage" id="questionCard">
        <button id="jokerBtn" class="btn joker-btn" type="button">Usar comodín</button>
        <span class="badge" id="phaseBadge">LOBBY</span>
        <div class="panel question-panel">
          <h2 id="questionTitle" class="question-label">Esperando pregunta…</h2>
          <p id="questionText" class="hint">El presentador abrirá la siguiente pregunta.</p>
          <p id="usualCorrectHint" class="hint" style="display:none;"></p>
        </div>
        <div class="time-line"><div class="time-line-fill"></div></div>
        <img id="questionImage" class="question-image-large" alt="" style="display:none;">
        <div id="optionsContainer" class="options-grid tight"></div>
        <div id="freeTextContainer" style="display:none; gap:10px;" class="form-row">
          <input id="freeTextInput" class="input" placeholder="Escribe tu respuesta">
          <button class="btn" type="button" id="sendTextBtn">Enviar</button>
        </div>
        <div class="cashout-row" id="cashoutRow" style="display:none;">
          <button class="btn" id="cashoutKeepBtn" type="button">Plantarse (mantener)</button>
          <button class="btn" id="cashoutBoostBtn" type="button">Plantarse x1.5</button>
        </div>
        <div class="stage-bottom">
          <div class="timer-medal" style="display:none;" id="timerBar">
            <div class="timer-fill" id="timerFill"></div>
            <div class="timer-medal-label"><span id="medalLabel">1%</span></div>
          </div>
          <span class="alive-count" id="aliveCountBadge"></span>
        </div>
        <div class="info-strip">
          <div class="status-row">
            <span class="badge" id="aliveBadge">—</span>
            <span class="badge" id="answerBadge">—</span>
          </div>
          <p class="hint" id="actionHint">Solo se puede responder cuando la pregunta está abierta.</p>
          <p class="hint" id="preloadHint" style="display:none;"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/net.js"></script>
  <script src="/static/image-preload.js"></script>
  <script>
    const overlay = document.getElementById('overlay');
    const overlayIcon = document.getElementById('overlayIcon');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const joinForm = document.getElementById('joinForm');
    const joinSection = document.getElementById('joinSection');
    const gameSection = document.getElementById('gameSection');
    const questionTitle = document.getElementById('questionTitle');
    const questionText = document.getElementById('questionText');
    const usualCorrectHint = document.getElementById('usualCorrectHint');
    const questionImage = document.getElementById('questionImage');
    const optionsContainer = document.getElementById('optionsContainer');
    const freeTextContainer = document.getElementById('freeTextContainer');
    const freeTextInput = document.getElementById('freeTextInput');
    const sendTextBtn = document.getElementById('sendTextBtn');
    const phaseBadge = document.getElementById('phaseBadge');
    const aliveBadge = document.getElementById('aliveBadge');
    const answerBadge = document.getElementById('answerBadge');
    const codeBadge = document.getElementById('codeBadge');
    const scoreBadge = document.getElementById('scoreBadge');
    const playerBadge = document.getElementById('playerBadge');
    const jokerBtn = document.getElementById('jokerBtn');
    const joinHint = document.getElementById('joinHint');
    const actionHint = document.getElementById('actionHint');
    const timerBar = document.getElementById('timerBar');
    const timerFill = document.getElementById('timerFill');
    const resetBtn = document.getElementById('resetBtn');
    const questionCard = document.getElementById('questionCard');
    const cashoutKeepBtn = document.getElementById('cashoutKeepBtn');
    const cashoutRow = document.getElementById('cashoutRow');
    const medalLabel = document.getElementById('medalLabel');
    const aliveCountBadge = document.getElementById('aliveCountBadge');
    const cashoutBoostBtn = document.getElementById('cashoutBoostBtn');
    const codeInput = document.getElementById('codeInput');
    const nameInput = document.getElementById('nameInput');
    const rosterSection = document.getElementById('rosterSection');
    const rosterSearchInput = document.getElementById('rosterSearchInput');
    const rosterList = document.getElementById('rosterList');

    const urlParams = new URLSearchParams(window.location.search);
    const initialCodeParam = (urlParams.get('code') || '').toUpperCase();
    const initialNameParam = urlParams.get('name') || '';
    const initialRefParam = urlParams.get('ref') || '';

    const storage = {
      get() {
        return {
          gameId: localStorage.getItem('player_game_id'),
          playerToken: localStorage.getItem('player_token'),
          playerName: localStorage.getItem('player_name'),
          code: localStorage.getItem('player_code'),
          externalRef: localStorage.getItem('player_external_ref'),
        };
      },
      set({ gameId, playerToken, playerName, code, externalRef }) {
        localStorage.setItem('player_game_id', gameId);
        localStorage.setItem('player_token', playerToken);
        localStorage.setItem('player_name', playerName);
        localStorage.setItem('player_code', code);
        if (externalRef) localStorage.setItem('player_external_ref', externalRef);
        else localStorage.removeItem('player_external_ref');
      },
      clear() {
        ['player_game_id', 'player_token', 'player_name', 'player_code', 'player_external_ref'].forEach(k => localStorage.removeItem(k));
      }
    };

    // Clave aleatoria de este móvil: si la petición de unirse se reintenta o
    // se pierde la sesión, el servidor lo reconoce como el mismo jugador.
    function clientKey() {
      let key = localStorage.getItem('player_client_key');
      if (!key) {
        key = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`).replace(/-/g, '').slice(0, 32);
        localStorage.setItem('player_client_key', key);
      }
      return key;
    }

    // Acción pendiente de confirmar por el servidor (respuesta, comodín o
    // plantarse). Se guarda en el móvil y se reenvía hasta que llega, aunque
    // se recargue la página; mientras, la pantalla ya la da por hecha.
    const pendingStore = {
      get() {
        try {
          return JSON.parse(localStorage.getItem('player_pending_action') || 'null');
        } catch (_) {
          return null;
        }
      },
      set(action) {
        localStorage.setItem('player_pending_action', JSON.stringify(action));
      },
      clear() {
        localStorage.removeItem('player_pending_action');
      },
    };

    Net.connectionBadge();

    let poller = null;
    let lastState = null;
    let currentQuestionId = null;
    let freeTextDraft = '';
    let timerInterval = null;
    let timerEndsAt = null;
    let timerTotal = null;
    let autoSubmittedFor = null;
    let autoSubmitTimeout = null;

    function setStatus(text, color) {
      playerBadge.textContent = text;
      if (color) {
        playerBadge.style.background = color;
      }
    }

    function showOverlay(type, title, sub) {
      overlay.className = `overlay visible ${type}`;
      overlayIcon.textContent = type === 'danger' ? '✖' : '✔';
      overlayTitle.textContent = title;
      overlaySub.textContent = sub || '';
    }

    function hideOverlay() {
      overlay.className = 'overlay';
    }

    function showJoinForm() {
      delete document.body.dataset.phase;
      joinSection.style.display = 'block';
      gameSection.style.display = 'none';
      resetBtn.style.display = 'none';
      setStatus('Sin unir', '');
      codeBadge.textContent = 'Código: —';
    }

    function showGame() {
      joinSection.style.display = 'none';
      gameSection.style.display = 'grid';
      resetBtn.style.display = 'inline-flex';
      const preloadHint = document.getElementById('preloadHint');
      ImagePreloader.preloadAll((done, total) => {
        if (!total) return;
        preloadHint.style.display = 'block';
        preloadHint.textContent =
          done < total ? `Descargando imágenes del juego… ${done}/${total}` : 'Imágenes del juego listas ✔';
      });
    }

    let joining = false;

    async function joinGame(code, name, externalRef) {
      if (joining) return;
      joining = true;
      joinHint.textContent = 'Conectando...';
      try {
        // Se reintenta solo: si una respuesta se pierde por el camino, la
        // clave del móvil hace que el reintento devuelva el mismo jugador.
        const data = await Net.request('/api/games/join', {
          method: 'POST',
          body: {
            code,
            player_name: name,
            external_ref: externalRef || undefined,
            client_key: clientKey(),
          },
          retries: 8,
        });
        storage.set({ gameId: data.game_id, playerToken: data.player_token, playerName: name, code: data.code, externalRef });
        codeBadge.textContent = `Código: ${data.code}`;
        setStatus(`Jugador: ${name}`, 'var(--panel-strong)');
        startPolling();
        showGame();
        joinHint.textContent = '';
      } catch (e) {
        joinHint.textContent = e.status
          ? e.detail || 'No se pudo unir'
          : 'No hay conexión con el juego. Comprueba tu conexión y vuelve a intentarlo.';
      } finally {
        joining = false;
      }
    }

    let currentRoster = [];

    function setRosterMode(enabled) {
      rosterSection.style.display = enabled ? 'block' : 'none';
      nameInput.style.display = enabled ? 'none' : '';
      nameInput.required = !enabled;
    }

    function renderRosterList(query) {
      const normalized = query.trim().toLowerCase();
      const filtered = currentRoster.filter((entry) => entry.name.toLowerCase().includes(normalized));
      rosterList.innerHTML = '';
      if (filtered.length === 0) {
        rosterList.innerHTML = '<p class="hint">Nadie coincide con esa búsqueda.</p>';
        return;
      }
      filtered.forEach((entry) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn secondary';
        btn.style.width = '100%';
        btn.style.textAlign = 'left';
        btn.textContent = entry.name;
        btn.addEventListener('click', () => {
          const code = codeInput.value.trim().toUpperCase();
          joinGame(code, entry.name, entry.id);
        });
        rosterList.appendChild(btn);
      });
    }

    async function fetchRosterForCode(code) {
      if (!code || code.length < 3) {
        setRosterMode(false);
        return;
      }
      try {
        const res = await fetch(`/api/games/by-code/${encodeURIComponent(code)}/roster`);
        if (!res.ok) {
          setRosterMode(false);
          return;
        }
        const roster = await res.json();
        if (Array.isArray(roster) && roster.length > 0) {
          currentRoster = roster;
          setRosterMode(true);
          renderRosterList('');
        } else {
          setRosterMode(false);
        }
      } catch (_) {
        setRosterMode(false);
      }
    }

    rosterSearchInput?.addEventListener('input', (e) => renderRosterList(e.target.value));

    let rosterFetchTimeout = null;
    codeInput?.addEventListener('input', (e) => {
      const code = e.target.value.trim().toUpperCase();
      if (rosterFetchTimeout) clearTimeout(rosterFetchTimeout);
      rosterFetchTimeout = setTimeout(() => fetchRosterForCode(code), 400);
    });

    joinForm?.addEventListener('submit', (e) => {
      e.preventDefault();
      if (rosterSection.style.display === 'block') return; // se une pulsando su nombre en la lista
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      const name = document.getElementById('nameInput').value.trim();
      if (!code || !name) return;
      joinGame(code, name);
    });

    resetBtn.addEventListener('click', () => {
      const { gameId, playerToken } = storage.get();
      if (gameId && playerToken) {
        Net.request(`/api/games/${gameId}/leave?player_token=${encodeURIComponent(playerToken)}`, {
          method: 'POST',
          retries: 3,
        }).catch(() => {});
      }
      storage.clear();
      pendingStore.clear();
      pending = null;
      // Quien sale a propósito entra después como jugador nuevo.
      localStorage.removeItem('player_client_key');
      lastState = null;
      currentQuestionId = null;
      freeTextDraft = '';
      if (poller) poller.stop();
      poller = null;
      showJoinForm();
      hideOverlay();
    });

    function sessionLost(message) {
      const { code, playerName } = storage.get();
      storage.clear();
      pendingStore.clear();
      pending = null;
      if (poller) poller.stop();
      poller = null;
      lastState = null;
      currentQuestionId = null;
      if (code) codeInput.value = code;
      if (playerName) nameInput.value = playerName;
      showJoinForm();
      hideOverlay();
      joinHint.textContent = message;
    }

    // El servidor ya no reconoce la sesión (p. ej. un reinicio justo tras
    // unirse): se vuelve a unir solo con la clave del móvil, sin que el
    // jugador tenga que hacer nada. Solo se le devuelve al formulario si la
    // partida terminó o el presentador lo sacó.
    let rejoining = false;
    async function recoverSession() {
      if (rejoining) return;
      rejoining = true;
      const { code, playerName, externalRef } = storage.get();
      try {
        const data = await Net.request('/api/games/join', {
          method: 'POST',
          body: {
            code,
            player_name: playerName,
            external_ref: externalRef || undefined,
            client_key: clientKey(),
            auto_rejoin: true,
          },
          retries: 5,
        });
        storage.set({ gameId: data.game_id, playerToken: data.player_token, playerName, code: data.code, externalRef });
        refresh();
        sendPending();
      } catch (e) {
        if (e.status) sessionLost(e.detail || 'Tu sesión ha caducado. Vuelve a unirte.');
        // Sin conexión: se vuelve a intentar en el siguiente sondeo.
      } finally {
        rejoining = false;
      }
    }

    let missingStreak = 0;

    async function fetchState() {
      const { gameId, playerToken, playerName, code } = storage.get();
      if (!gameId || !playerToken) return;
      let state;
      try {
        state = await Net.request(
          `/api/games/${gameId}/player/state?player_token=${encodeURIComponent(playerToken)}`,
          { timeoutMs: 6000 },
        );
      } catch (e) {
        if (e.status === 401) {
          await recoverSession();
          return;
        }
        if (e.status === 404) {
          if (++missingStreak >= 3) sessionLost('Esa partida ya no existe. Vuelve a unirte.');
          return;
        }
        throw e; // sin conexión o servidor ocupado: el sondeo espacia y reintenta
      }
      missingStreak = 0;
      if (storage.get().playerToken !== playerToken) return; // la sesión cambió mientras tanto
      lastState = state;
      codeBadge.textContent = `Código: ${code || '—'}`;
      setStatus(`Jugador: ${playerName || '—'}`, 'var(--panel-strong)');
      renderState(applyPending(state));
    }

    function renderTimer(state) {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timerEndsAt = null;
      timerTotal = null;
      if (autoSubmitTimeout) {
        clearTimeout(autoSubmitTimeout);
        autoSubmitTimeout = null;
      }

      const pctKnown = state.current_question?.usual_correct_percentage;
      medalLabel.textContent =
        pctKnown != null ? `${String(pctKnown).replace('.', ',')}%` : '1%';

      const ms = state.answer_time_left_ms ?? 0;
      if (state.phase === 'answering' && ms > 0) {
        timerBar.style.display = 'block';
        timerTotal = state.current_question?.time_limit_seconds
          ? state.current_question.time_limit_seconds * 1000
          : ms;
        timerEndsAt = Date.now() + ms;
        // Autoenvío del texto libre 1 s antes del final, para que llegue a
        // tiempo aunque la red vaya lenta (el servidor da además 3 s de margen).
        if (
          state.current_question?.type === 'free_text' &&
          state.alive &&
          !state.has_answered &&
          state.can_answer
        ) {
          autoSubmitTimeout = setTimeout(() => {
            if (
              state.current_question &&
              autoSubmittedFor !== state.current_question.id &&
              state.alive &&
              !state.has_answered
            ) {
              autoSubmittedFor = state.current_question.id;
              submitAnswer(state.current_question.id, null, freeTextInput.value);
            }
          }, Math.max(0, ms - 1000));
        }
        const update = () => {
          const remaining = Math.max(0, timerEndsAt - Date.now());
          const pct = Math.max(0, Math.min(100, (remaining / timerTotal) * 100));
          timerFill.style.width = pct + '%';
          document.body.style.setProperty('--pct', pct);
          if (
            remaining <= 0 &&
            timerInterval &&
            state.current_question?.type === 'free_text' &&
            state.alive &&
            !state.has_answered &&
            autoSubmittedFor !== state.current_question.id
          ) {
            autoSubmittedFor = state.current_question.id;
            submitAnswer(state.current_question.id, null, freeTextInput.value);
            clearInterval(timerInterval);
          }
          if (remaining <= 0 && timerInterval) clearInterval(timerInterval);
        };
        update();
        timerInterval = setInterval(update, 150);
      } else {
        // Fuera del tiempo de respuesta el medallón sigue mostrando el % de
        // la pregunta, con el anillo lleno.
        const questionOnScreen =
          state.current_question &&
          ['question_waiting', 'answering', 'results'].includes(state.phase) &&
          !state.can_cashout_keep &&
          !state.can_cashout_boost;
        timerBar.style.display = questionOnScreen ? 'block' : 'none';
        document.body.style.setProperty('--pct', 100);
      }
    }

    function renderState(state) {
      document.body.dataset.phase = state.phase;
      phaseBadge.textContent = state.phase.toUpperCase();
      scoreBadge.textContent = `Puntos: ${Math.round(state.score)}`;
      const aliveText = state.status === 'cashed_out'
        ? 'Plantado'
        : state.alive
        ? 'Sigues en juego'
        : 'Eliminado';
      aliveBadge.textContent = aliveText;
      aliveCountBadge.textContent =
        state.alive_count != null ? `${state.alive_count} de ${state.total_players} en pie` : '';
      aliveBadge.className = 'badge ' + (state.status === 'cashed_out' ? 'success' : state.alive ? 'success' : 'danger');

      answerBadge.textContent = state.has_answered ? 'Respuesta enviada' : 'Sin responder';
      answerBadge.className = 'badge ' + (state.has_answered ? 'success' : '');

      renderTimer(state);

      const isCashOut = state.status === 'cashed_out';
      const cashoutKeepOpen = state.can_cashout_keep && state.status === 'alive';
      const cashoutBoostOpen = state.can_cashout_boost && state.status === 'alive';
      const cashoutWindowOpen = (cashoutKeepOpen || cashoutBoostOpen) && state.status === 'alive';
      cashoutKeepBtn.style.display = cashoutKeepOpen ? 'block' : 'none';
      cashoutBoostBtn.style.display = cashoutBoostOpen ? 'block' : 'none';
      cashoutRow.style.display = cashoutWindowOpen ? 'grid' : 'none';

      if (state.phase === 'intermission') {
        currentQuestionId = null;
        const afterPractice = !!state.current_question?.practice;
        questionTitle.textContent = afterPractice ? 'Fin de la prueba' : 'Resumen de la ronda';
        questionText.textContent = '';
        usualCorrectHint.style.display = 'none';
        questionImage.style.display = 'none';
        optionsContainer.innerHTML = afterPractice
          ? `
          <div class="stat-big">
            <div class="stat-big-label">Ya sabes cómo funciona. Ahora empieza la partida de verdad.</div>
          </div>
        `
          : `
          <div class="stat-big">
            <div class="stat-big-number">${state.intermission_eliminated_count ?? 0}</div>
            <div class="stat-big-label">eliminados en esta ronda</div>
            <div class="stat-big-sub">${state.intermission_joker_count ?? 0} han usado comodín</div>
          </div>
        `;
        freeTextContainer.style.display = 'none';
        jokerBtn.disabled = true;
        questionCard.style.pointerEvents = 'auto';
        hideOverlay();
        actionHint.textContent = afterPractice
          ? 'Espera a que el presentador abra la primera pregunta.'
          : `Quedan ${state.intermission_alive_count ?? '—'} en juego. Espera a que el presentador abra la siguiente pregunta.`;
        return;
      }

      if (!state.current_question || cashoutWindowOpen) {
        questionTitle.textContent = cashoutWindowOpen ? '¿Te plantas?' : 'Esperando pregunta...';
        questionText.textContent = cashoutWindowOpen
          ? 'Plantarse está abierto. Elige si mantienes o x1.5 tus puntos.'
          : 'El presentador aún no ha abierto la ronda.';
        optionsContainer.innerHTML = '';
        usualCorrectHint.style.display = 'none';
        questionImage.style.display = 'none';
        freeTextContainer.style.display = 'none';
        jokerBtn.disabled = true;
        questionCard.style.pointerEvents = 'auto';
        if (cashoutWindowOpen) {
          hideOverlay();
          actionHint.textContent = 'Plantarse disponible. Selecciona mantener o x1.5.';
        } else {
          hideOverlay();
        }
        return;
      }

      const q = state.current_question;
      const isNewQuestion = q.id !== currentQuestionId;
      if (isNewQuestion) {
        currentQuestionId = q.id;
        freeTextDraft = '';
        autoSubmittedFor = null;
      }
      questionTitle.textContent = q.practice ? 'Pregunta de prueba' : `Pregunta ${q.order}`;
      questionText.textContent = q.text;
      if (q.practice) {
        usualCorrectHint.textContent = 'Es de prueba: no cuenta para la partida y nadie queda eliminado.';
        usualCorrectHint.style.display = 'block';
      } else if (q.usual_correct_percentage != null) {
        usualCorrectHint.textContent = `Normalmente la acierta el ${q.usual_correct_percentage}% de la gente.`;
        usualCorrectHint.style.display = 'block';
      } else {
        usualCorrectHint.style.display = 'none';
      }
      if (q.image) {
        questionImage.src = ImagePreloader.src(q.image);
        questionImage.alt = q.text;
        questionImage.style.display = 'block';
      } else {
        questionImage.style.display = 'none';
      }
      if (isNewQuestion) {
        // Al título/badges de la cabecera de la tarjeta les sobra tanto
        // espacio con la barra de tiempo que, si se hace scroll hasta el
        // borde de la tarjeta entera, la pregunta en sí (imagen + texto)
        // se queda fuera de la pantalla en móvil. Se espera un frame para
        // que el navegador ya haya colocado la imagen/texto nuevos antes
        // de medir dónde hacer scroll.
        requestAnimationFrame(() => {
          (q.image ? questionImage : questionText).scrollIntoView({
            behavior: 'smooth',
            block: 'start',
          });
        });
      }

      const canAnswerNow = state.can_answer && !state.has_answered && state.alive && !isCashOut && !cashoutWindowOpen;
      const canUseJoker = !q.practice && state.can_answer && state.joker_available && !state.has_answered && state.alive && !isCashOut && !cashoutWindowOpen;
      jokerBtn.disabled = !canUseJoker;
      cashoutKeepBtn.disabled = false;
      cashoutBoostBtn.disabled = false;

      optionsContainer.classList.toggle(
        'has-images',
        q.type === 'single_choice' && !!q.options?.some((opt) => opt.image),
      );
      if (q.type === 'single_choice' && q.options) {
        freeTextContainer.style.display = 'none';
        optionsContainer.innerHTML = '';
        q.options.forEach(opt => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'option-card';
          if (state.has_answered && state.last_answer === opt.id) card.classList.add('selected');
          card.disabled = !canAnswerNow;
          card.innerHTML = `
            <span class="opt-letter">${opt.id.toUpperCase()}</span>
            ${opt.image ? `<img src="${ImagePreloader.src(opt.image)}" alt="${opt.text || opt.id}">` : ''}
            ${opt.text ? `<span class="opt-text">${opt.text.replace(/</g,'&lt;')}</span>` : ''}
          `;
          card.addEventListener('click', () => submitAnswer(q.id, opt.id, null));
          optionsContainer.appendChild(card);
        });
      } else {
        optionsContainer.innerHTML = '';
        freeTextContainer.style.display = 'flex';
        if (q.numeric_answer) {
          freeTextInput.setAttribute('inputmode', 'numeric');
          freeTextInput.setAttribute('pattern', '[0-9]*');
          freeTextInput.placeholder = 'Escribe un número';
        } else {
          freeTextInput.setAttribute('inputmode', 'text');
          freeTextInput.removeAttribute('pattern');
          freeTextInput.placeholder = 'Escribe tu respuesta';
        }
        if (isNewQuestion) {
          freeTextInput.value = '';
          freeTextDraft = '';
        } else if (freeTextDraft !== undefined && freeTextInput.value !== freeTextDraft) {
          freeTextInput.value = freeTextDraft;
        }
        freeTextInput.disabled = !canAnswerNow;
        sendTextBtn.disabled = !canAnswerNow;
        sendTextBtn.onclick = () => submitAnswer(q.id, null, freeTextInput.value);
      }

      if (!state.can_answer) {
        actionHint.textContent = 'Ventana cerrada. Espera la siguiente pregunta.';
      } else if (state.has_answered) {
        actionHint.textContent = 'Respuesta enviada. Espera resultados.';
      } else {
        actionHint.textContent = q.practice
          ? 'Pregunta de prueba abierta. Elige una opción.'
          : 'Pregunta abierta. Elige opción o usa tu comodín.';
      }

      if (state.status === 'cashed_out') {
        questionCard.style.pointerEvents = 'none';
        showOverlay('success', 'Te has plantado', `Puntos finales: ${Math.round(state.score)}`);
      } else if (!state.alive) {
        questionCard.style.pointerEvents = 'none';
        showOverlay('danger', 'Respuesta incorrecta', `Has sido eliminado. Puntos: ${Math.round(state.score)}`);
      } else if (state.phase === 'answering' && state.has_answered) {
        questionCard.style.pointerEvents = 'none';
        showOverlay('info', 'Respuesta enviada', 'Espera a que acabe el tiempo');
      } else if (state.phase === 'results' && q.practice) {
        questionCard.style.pointerEvents = 'none';
        if (state.last_answer_correct === true) {
          showOverlay('success', '¡Correcto!', 'Era de prueba: así funciona el juego');
        } else {
          showOverlay('info', 'Has fallado', 'Era de prueba: no cuenta y sigues en juego');
          overlayIcon.textContent = '✖';
        }
      } else if (state.phase === 'results') {
        questionCard.style.pointerEvents = 'none';
        if (state.alive) {
          const msg =
            state.last_answer_correct === true
              ? 'Has acertado'
              : state.last_answer_correct === null || state.last_answer_correct === undefined
              ? 'Comodín usado, sigues vivo'
              : 'Sigues vivo';
          showOverlay('success', '¡Sigues en juego!', msg);
        } else {
          showOverlay('danger', 'Respuesta incorrecta', `Has sido eliminado. Puntos: ${Math.round(state.score)}`);
        }
      } else {
        questionCard.style.pointerEvents = 'auto';
        hideOverlay();
      }
    }

    // Mientras el servidor no confirma la acción pendiente, la pantalla se
    // pinta como si ya hubiera llegado.
    function applyPending(state) {
      const action = pending;
      if (!action || !state || action.gameId !== state.game_id) return state;
      const q = state.current_question;
      if (
        (action.kind === 'answer' || action.kind === 'joker') &&
        q &&
        q.id === action.body.question_id &&
        state.phase === 'answering' &&
        state.status === 'alive'
      ) {
        return {
          ...state,
          has_answered: true,
          last_answer:
            action.kind === 'answer' ? action.body.selected_option_id || action.body.text_answer : state.last_answer,
          joker_available: action.kind === 'joker' ? false : state.joker_available,
        };
      }
      if (action.kind === 'cashout' && state.status === 'alive') {
        return {
          ...state,
          status: 'cashed_out',
          alive: false,
          cashed_out_multiplier: action.body.multiplier,
          score: state.score * action.body.multiplier,
          can_cashout_keep: false,
          can_cashout_boost: false,
        };
      }
      return state;
    }

    function queueAction(action) {
      pending = action;
      pendingStore.set(action);
      if (lastState) renderState(applyPending(lastState));
      sendPending();
    }

    function settle(action) {
      if (pending === action) {
        pending = null;
        pendingStore.clear();
      }
      refresh();
    }

    let sendingPending = false;
    let pendingRetryTimer = null;

    async function sendPending() {
      if (!pending || sendingPending) return;
      const action = pending;
      const { gameId, playerToken } = storage.get();
      if (!gameId || !playerToken || action.gameId !== gameId) {
        settle(action);
        return;
      }
      sendingPending = true;
      clearTimeout(pendingRetryTimer);
      try {
        await Net.request(`/api/games/${gameId}/${action.path}`, {
          method: 'POST',
          body: { ...action.body, player_token: playerToken },
          retries: 6,
          shouldContinue: () => pending === action,
        });
        settle(action); // confirmada
      } catch (e) {
        if (e.status === 401) {
          // Sesión perdida: se recupera y se vuelve a mandar.
          recoverSession();
          pendingRetryTimer = setTimeout(sendPending, 1500);
        } else if (e.status && !Net.isRetryable(e.status)) {
          // Rechazo definitivo (p. ej. la pregunta ya se cerró): manda lo
          // que diga el servidor en el siguiente sondeo.
          settle(action);
        } else {
          pendingRetryTimer = setTimeout(sendPending, 2000); // sigue sin conexión
        }
      } finally {
        sendingPending = false;
      }
    }

    function submitAnswer(questionId, optionId, text) {
      const { gameId } = storage.get();
      if (!gameId) return;
      if (pending && pending.gameId === gameId && pending.body.question_id === questionId) return; // ya enviada
      if (lastState?.has_answered && lastState?.current_question?.id === questionId) return;
      freeTextDraft = '';
      queueAction({
        kind: 'answer',
        path: 'answer',
        gameId,
        createdAt: Date.now(),
        body: { question_id: questionId, selected_option_id: optionId, text_answer: text },
      });
    }

    function useJoker() {
      const { gameId } = storage.get();
      const q = lastState?.current_question;
      if (!gameId || !q) return;
      if (pending && pending.gameId === gameId && pending.body.question_id === q.id) return;
      queueAction({ kind: 'joker', path: 'joker', gameId, createdAt: Date.now(), body: { question_id: q.id } });
    }

    jokerBtn.addEventListener('click', useJoker);
    cashoutKeepBtn.addEventListener('click', () => cashOut(1, lastState));
    cashoutBoostBtn.addEventListener('click', () => cashOut(1.5, lastState));
    freeTextInput.addEventListener('input', (e) => {
      if (lastState?.current_question?.numeric_answer) {
        const digitsOnly = e.target.value.replace(/[^0-9]/g, '');
        if (digitsOnly !== e.target.value) e.target.value = digitsOnly;
      }
      freeTextDraft = e.target.value;
    });

    function cashOut(multiplier, state) {
      const { gameId } = storage.get();
      if (!gameId) return;
      const canKeep = state?.can_cashout_keep && state?.status === 'alive';
      const canBoost = state?.can_cashout_boost && state?.status === 'alive';
      if ((multiplier === 1 && !canKeep) || (multiplier > 1 && !canBoost)) return;
      if (pending && pending.kind === 'cashout') return;
      queueAction({ kind: 'cashout', path: 'cashout', gameId, createdAt: Date.now(), body: { multiplier } });
    }

    function refresh() {
      if (poller) poller.now();
    }

    function startPolling() {
      if (poller) poller.stop();
      poller = Net.poll(fetchState, 1000);
      sendPending();
    }

    // Al volver a la pestaña o recuperar la red: se consulta ya y se reenvía
    // lo pendiente.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        refresh();
        sendPending();
      }
    });
    window.addEventListener('online', () => {
      refresh();
      sendPending();
    });

    // Una acción pendiente de hace mucho ya no tiene sentido reenviarla.
    let pending = pendingStore.get();
    if (pending && Date.now() - (pending.createdAt || 0) > 10 * 60 * 1000) {
      pending = null;
      pendingStore.clear();
    }

    // Auto-rejoin if data exists
    const saved = storage.get();
    if (saved.gameId && saved.playerToken) {
      codeBadge.textContent = `Código: ${saved.code || '—'}`;
      setStatus(`Jugador: ${saved.playerName || '—'}`, 'var(--panel-strong)');
      showGame();
      startPolling();
    } else if (initialCodeParam && initialNameParam && initialRefParam) {
      // Enlace directo desde el hub de la competición: entra automáticamente
      // sin que el invitado tenga que teclear nada.
      document.getElementById('codeInput').value = initialCodeParam;
      document.getElementById('nameInput').value = initialNameParam;
      joinGame(initialCodeParam, initialNameParam, initialRefParam);
    } else {
      if (initialCodeParam) {
        document.getElementById('codeInput').value = initialCodeParam;
        fetchRosterForCode(initialCodeParam);
      }
      showJoinForm();
    }
  </script>
</body>
</html>
